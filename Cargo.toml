[workspace]
resolver = "2"
members = ["crates/contracts", "crates/kernel", "crates/adapters", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-core = "0.3"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "process", "io-util", "signal", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
bytes = "1"
axum = "0.8"
alcoler-contracts = { path = "crates/contracts" }
alcoler-kernel = { path = "crates/kernel" }
alcoler-adapters = { path = "crates/adapters" }
