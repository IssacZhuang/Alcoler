[package]
name = "e1feed"
version = "0.1.0"
edition = "2021"

# Same source builds twice: native (x86_64-pc-windows-msvc) and wasm32-wasip1
# for the WASM-sandbox variant. Pure std + serde_json; no threads, no sockets,
# no C toolchain, so both targets compile without host-specific setup.

[dependencies]
serde_json = "1"

[profile.release]
opt-level = 2
