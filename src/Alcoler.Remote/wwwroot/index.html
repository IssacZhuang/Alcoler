<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alcoler Remote</title>
<meta name="description" content="Remote control for the Alcoler coding agent.">
<meta name="theme-color" content="#191919">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="app"></div>
<noscript>
  <div class="noscript">Alcoler Remote needs JavaScript to run. Enable JavaScript and reload this page.</div>
</noscript>

<template id="view-pair">
  <section class="view pair-view">
    <div class="pair-wrap">
      <div class="pair-logo" aria-hidden="true">
        <img src="icons/favicon.svg" alt="" width="72" height="72">
      </div>
      <h1 class="pair-title">Alcoler</h1>
      <p id="pair-status" class="pair-status">Connecting to desktop...</p>
      <div id="pair-auto" class="pair-auto" hidden>
        <p class="pair-msg"><span class="spinner" aria-hidden="true"></span><span id="pair-msg">Pairing with desktop...</span></p>
        <button id="pair-retry" class="btn primary" hidden>Retry pairing</button>
      </div>
      <form id="pair-form" class="pair-form" autocomplete="off" hidden>
        <label for="pair-code">Pairing code</label>
        <input id="pair-code" type="text" autocapitalize="off" autocorrect="off" spellcheck="false"
          placeholder="Paste the pairing code or QR link">
        <button type="submit" class="btn primary">Pair this device</button>
      </form>
      <p id="pair-error" class="pair-error" hidden></p>
      <p class="pair-hint">Open Alcoler on your computer, scan its pairing QR code with this phone, then come back here.</p>
    </div>
  </section>
</template>

<template id="view-shell">
  <div id="shell" class="shell" data-route="draft">
    <aside class="sidebar">
      <div class="sb-topbar desktop-only">
        <span class="sb-brand"><img class="sb-brand-icon" src="icons/favicon.svg" alt="" width="24" height="24">Alcoler</span>
        <button id="btn-sb-refresh" type="button" class="icon-btn" aria-label="Refresh sessions" title="Refresh sessions"></button>
      </div>
      <div class="sb-mobilebar mobile-only">
        <img class="sb-brand-icon" src="icons/favicon.svg" alt="Alcoler" width="28" height="28">
        <h1 class="sb-mobile-title">Sessions</h1>
        <div class="sb-mobile-actions">
          <button id="btn-m-refresh" type="button" class="icon-btn" aria-label="Refresh sessions" title="Refresh sessions"></button>
          <button id="btn-m-new" type="button" class="icon-btn" aria-label="New task" title="New task"></button>
        </div>
      </div>
      <div class="sb-actions desktop-only">
        <button id="btn-new-task" type="button" class="new-task-btn">
          <span class="new-task-icon" aria-hidden="true"></span>
          <span class="new-task-label">New task</span>
          <span class="new-task-hint">Ctrl+N</span>
        </button>
      </div>
      <div class="sb-heading desktop-only">
        <span>Projects</span>
      </div>
      <div id="session-scroll" class="session-scroll">
        <div id="session-list" class="session-list"></div>
      </div>
    </aside>

    <main class="main-pane">
      <section id="pane-draft" class="pane pane-draft">
        <header class="pane-header">
          <button id="btn-draft-back" type="button" class="icon-btn mobile-only" aria-label="Back to sessions" title="Back to sessions"></button>
          <span class="pane-title">New task</span>
        </header>
        <div class="draft-body">
          <div class="draft-stack">
            <h1 class="draft-greeting">What can I help you build?</h1>
            <button id="btn-workspace" type="button" class="workspace-btn">
              <span class="workspace-icon" aria-hidden="true"></span>
              <span id="workspace-name" class="workspace-name">Choose workspace</span>
              <span class="workspace-chevron" aria-hidden="true"></span>
            </button>
            <div class="composer-shell" data-composer="draft">
              <div class="attach-row" hidden></div>
              <textarea class="composer-input" rows="1" placeholder="Message Alcoler" aria-label="Message Alcoler"></textarea>
              <div class="composer-models">
                <select class="model-select" aria-label="Model" disabled>
                  <option value="">Loading models...</option>
                </select>
                <label class="effort-picker" hidden>
                  <span>Thinking</span>
                  <select class="effort-select" aria-label="Thinking effort" disabled></select>
                </label>
              </div>
              <div class="composer-toolbar">
                <button type="button" class="composer-attach icon-btn" aria-label="Attach photos" title="Attach photos"></button>
                <label class="mode-picker">
                  <span class="mode-icon" aria-hidden="true"></span>
                  <select class="mode-select" aria-label="Permission mode">
                    <option value="build">Build</option>
                    <option value="edit">Edit</option>
                    <option value="yolo">Full access</option>
                  </select>
                </label>
                <span class="plan-badge" hidden>Plan</span>
                <span class="toolbar-spacer"></span>
                <button type="button" class="composer-send send-btn" aria-label="Send" disabled></button>
                <input class="composer-file" type="file" accept="image/*" capture="environment" multiple hidden>
              </div>
            </div>
            <p id="draft-error" class="inline-error" hidden></p>
          </div>
        </div>
        <div id="draft-sending" class="sending-overlay" hidden>
          <span class="spinner" aria-hidden="true"></span>
        </div>
      </section>

      <section id="pane-session" class="pane pane-session">
        <header class="pane-header session-header">
          <button id="btn-back" type="button" class="icon-btn mobile-only" aria-label="Back to sessions" title="Back to sessions"></button>
          <div id="sess-title" class="pane-title session-title">Session</div>
          <div class="session-status">
            <span id="conn-dot" class="dot offline" title="Connection"></span>
            <span id="phase-text" class="phase-text">Idle</span>
            <span id="queue-badge" class="queue-badge" hidden></span>
          </div>
        </header>
        <div id="conn-banner" class="conn-banner" hidden></div>
        <div class="transcript-region">
          <div id="transcript-scroll" class="transcript-scroll">
            <div id="transcript" class="transcript"></div>
            <div id="transcript-loading" class="transcript-loading">
              <span class="spinner" aria-hidden="true"></span>
            </div>
          </div>
          <button id="jump-latest" type="button" class="jump-pill" hidden></button>
        </div>
        <div class="desk">
          <div id="activity-bar" class="activity-bar" hidden>
            <span class="activity-dots" aria-hidden="true"><i></i><i></i><i></i></span>
            <span id="activity-text"></span>
          </div>
          <div class="desk-inner">
            <div id="queue-strip" class="queue-strip" hidden>
              <div class="queue-label">Queued messages</div>
              <div id="queue-chips" class="queue-chips"></div>
            </div>
            <div id="pending-cards"></div>
            <div class="composer-shell" data-composer="session">
              <div class="attach-row" hidden></div>
              <textarea class="composer-input" rows="1" placeholder="Message Alcoler" aria-label="Message Alcoler"></textarea>
              <div class="composer-models">
                <select class="model-select" aria-label="Model" disabled>
                  <option value="">Loading models...</option>
                </select>
                <label class="effort-picker" hidden>
                  <span>Thinking</span>
                  <select class="effort-select" aria-label="Thinking effort" disabled></select>
                </label>
              </div>
              <div class="composer-toolbar">
                <button type="button" class="composer-attach icon-btn" aria-label="Attach photos" title="Attach photos"></button>
                <label class="mode-picker">
                  <span class="mode-icon" aria-hidden="true"></span>
                  <select class="mode-select" aria-label="Permission mode">
                    <option value="build">Build</option>
                    <option value="edit">Edit</option>
                    <option value="yolo">Full access</option>
                  </select>
                </label>
                <span class="plan-badge" hidden>Plan</span>
                <span class="toolbar-spacer"></span>
                <button type="button" class="composer-send send-btn" aria-label="Send" disabled></button>
                <input class="composer-file" type="file" accept="image/*" capture="environment" multiple hidden>
              </div>
            </div>
          </div>
        </div>
        <div id="img-overlay" class="img-overlay" hidden>
          <button id="overlay-close" type="button" class="icon-btn overlay-close" aria-label="Close image"></button>
          <img id="overlay-img" alt="Attached image">
        </div>
      </section>
    </main>

    <div id="workspace-menu" class="modal-backdrop" hidden>
      <div class="workspace-dialog" role="dialog" aria-modal="true" aria-labelledby="workspace-title">
        <h2 id="workspace-title" class="workspace-title">Choose workspace</h2>
        <div id="workspace-options" class="workspace-options"></div>
        <form id="workspace-manual-form" class="workspace-manual">
          <label for="workspace-manual-input">Or enter a folder path</label>
          <div class="workspace-manual-row">
            <input id="workspace-manual-input" type="text" autocapitalize="off" autocorrect="off"
              spellcheck="false" placeholder="C:\Projects\myproject">
            <button type="submit" class="btn primary">Use path</button>
          </div>
        </form>
        <div class="workspace-actions">
          <button type="button" id="workspace-close" class="btn">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</template>

<script type="module" src="app.js"></script>
</body>
</html>
